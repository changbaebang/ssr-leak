version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week before proposing a new version: compromised releases are usually pulled within hours.
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # This package parses code with the TypeScript compiler API. TypeScript 7 (the Go compiler)
      # does not ship that JS API, so majors must be evaluated by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
