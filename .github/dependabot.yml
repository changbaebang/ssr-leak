version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait 30 days before proposing a new version. Compromised releases are usually pulled within
    # hours, and some corporate proxies refuse packages younger than a few weeks. Security updates
    # are not delayed by this.
    cooldown:
      default-days: 30
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      runtime-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # This package parses code with the TypeScript compiler API. TypeScript 7 (the Go compiler)
      # does not ship that JS API, so majors must be evaluated by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 30
    groups:
      github-actions:
        patterns: ['*']
