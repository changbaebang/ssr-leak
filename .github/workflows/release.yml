name: Release

on:
  # Normal path: a release commit (package.json version bump) lands on main. The tag is created by
  # this workflow, so the `v*` tag ruleset only needs to let GitHub Actions through — no human can
  # trigger a publish by pushing a tag.
  push:
    branches: [main]
  # Fallback while the ruleset still lets the admin create tags by hand.
    tags: ['v*']

permissions:
  contents: write # create the release tag
  id-token: write # npm trusted publishing (OIDC)

jobs:
  # Decide whether this main push is a release: the version in package.json changed and no tag
  # exists for it yet. Only commits merged by the repository owner count, so a collaborator with
  # write access cannot ship a release by merging a version bump.
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        env:
          OWNER: changbaebang
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::notice::${tag} already exists — not a release"; exit 0
          fi
          prev="$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo '')"
          if [ "${prev}" = "${version}" ]; then
            echo "::notice::package.json version unchanged (${version}) — not a release"; exit 0
          fi
          if [ "${ACTOR}" != "${OWNER}" ]; then
            echo "::warning::version changed to ${version} but the merge was performed by ${ACTOR}, not ${OWNER} — not releasing. The owner can re-run this workflow or push the tag."; exit 0
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "release ${tag} (merged by ${ACTOR})"

  tag:
    needs: gate
    if: needs.gate.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

  publish:
    # Runs after an automatic tag (same run: a tag pushed with GITHUB_TOKEN does not start a new
    # workflow) or on a manually pushed v* tag (fallback).
    needs: [gate, tag]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || needs.tag.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.tag || github.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          # No registry-url here: setup-node would write an empty _authToken to .npmrc and npm would then
          # skip the OIDC token exchange (403 "OIDC permission denied"). publishConfig.registry pins the target.
      # Trusted publishing (OIDC) needs npm >= 11.5.1; the npm bundled with Node 22 is older.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # No token: the job authenticates to npm with its OIDC identity (see the "Trusted Publisher"
      # setting on npmjs.com for this package). Provenance is attached automatically.
      - run: npm publish --provenance --access public
